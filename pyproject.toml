[project]
name = "qchem"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cosmosis",
    "h5py>=3.16.0",
    "rdkit>=2026.9.1",
    "torch-geometric>=2.8.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126/"
explicit = true

[[tool.uv.index]]
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.12.0+cu126.html"
explicit = true

[tool.uv.sources]
cosmosis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qchem"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]